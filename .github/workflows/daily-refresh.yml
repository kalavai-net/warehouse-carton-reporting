name: Daily data refresh

# Runs in GitHub's cloud (not Annie's Mac). Pulls the 3 email reports from Gmail,
# rebuilds the data snapshot, and pushes it to the PRIVATE data repo
# (kalavai-net/warehouse-data). The hosted Streamlit app reads that at runtime.
on:
  schedule:
    - cron: "0 19 * * *"     # 19:00 UTC ≈ 11am–12pm Pacific, after the reports arrive
  workflow_dispatch: {}       # also lets you run it on demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # this (code) repo

      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: kalavai-net/warehouse-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data
          persist-credentials: true        # so the push below is authenticated

      - name: Bring the previous snapshot into data/
        run: |
          mkdir -p data
          cp _data/data/*.parquet _data/data/*.json data/ 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull email reports + rebuild snapshot
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VSR_API_KEY: ${{ secrets.VSR_API_KEY }}
        run: python3 src/cloud_refresh.py

      - name: Push updated snapshot to the private data repo
        run: |
          cp data/consolidated.parquet data/source_status.json data/last_run.json _data/data/
          cd _data
          git config user.name "kalavai-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data change today."
          else
            git commit -m "Daily data refresh"
            git push
          fi
